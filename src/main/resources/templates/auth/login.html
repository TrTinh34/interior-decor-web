<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Home Decor Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{/fragments/header :: header}"></div>

<section class="login-section">

    <div class="login-header">
        <div class="login-logo"><i class="fa-solid fa-leaf"></i></div>
        <h1>Đăng nhập</h1>
        <p>Chào mừng bạn trở lại Home Decor Store</p>
    </div>

    <div class="login-card">

        <form th:action="@{/login}" method="POST">

            <div th:if="${param.error}" style="color: #dc3545; font-size: 13px; text-align: center; margin-bottom: 20px; font-weight: 500;">
                Email hoặc mật khẩu không chính xác!
            </div>

            <div class="form-group">
                <label>EMAIL</label>
                <input type="text" name="username" placeholder="your@email.com" required th:value="${param.username}">
            </div>

            <div class="form-group" style="position: relative;">
                <div class="password-header">
                    <label>MẬT KHẨU</label>
                    <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
                </div>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
                <i class="fa-regular fa-eye" id="eye-icon" onclick="togglePw()"
                   style="position: absolute; right: 16px; bottom: 13px; cursor: pointer; color: #b8b0a6; font-size: 14px;"></i>
            </div>

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="register-link">
            Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
        </div>

    </div>

</section>

<div th:replace="~{/fragments/footer :: footer}"></div>

<script>
    function togglePw() {
        const pw = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            pw.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>

</body>
</html>
