<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng - HOME DECOR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="cart-container">
    <a th:href="@{/product}" style="text-decoration: none; color: #666; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px;">
        <i class="fa-solid fa-arrow-left"></i> Tiếp tục mua hàng
    </a>

    <h2 class="cart-title">Giỏ hàng (<span th:text="${cart != null and cart.cartItems != null} ? ${cart.cartItems.size()} : 0">0</span> sản phẩm)</h2>

    <div th:if="${cart == null or #lists.isEmpty(cart.cartItems)}" style="text-align: center; padding: 60px 20px; background: #fff; border-radius: 8px;">
        <i class="fa-solid fa-basket-shopping" style="font-size: 48px; color: #ccc; margin-bottom: 15px;"></i>
        <p style="color: #666; font-size: 15px; margin-bottom: 20px;">Giỏ hàng của bạn đang trống.</p>
        <a th:href="@{/product}" class="btn-checkout" style="display: inline-block; width: auto; padding: 12px 30px;">Mua sắm ngay</a>
    </div>

    <div class="cart-layout" th:if="${cart != null and !#lists.isEmpty(cart.cartItems)}">
        <div class="cart-main">
            <div class="cart-table-header">
                <span>Sản phẩm</span>
                <span>Đơn giá</span>
                <span>Số lượng</span>
                <span>Thành tiền</span>
                <span></span>
            </div>

            <div class="cart-item" th:each="item : ${cart.cartItems}">
                <div class="cart-item-info">
                    <img th:src="${item.product.imageUrl != null} ? @{${item.product.imageUrl}} : @{/images/default-product.jpg}" class="cart-item-img" alt="Product">
                    <div class="cart-item-detail">
                        <h3 th:text="${item.product.name}">Tên sản phẩm Decor</h3>
                        <p th:text="${item.product.color != null ? 'Màu sắc: ' + item.product.color : 'Mặc định'}">Màu sắc</p>
                    </div>
                </div>

                <div class="cart-item-price" th:text="${#numbers.formatDecimal(item.product.price, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</div>

                <div>
                    <div class="quantity-control">
                        <button class="quantity-btn" th:onclick="'changeQuantity(' + ${item.id} + ', ' + (${item.quantity} - 1) + ')'">-</button>
                        <input type="text" class="quantity-input" th:value="${item.quantity}" readonly>
                        <button class="quantity-btn" th:onclick="'changeQuantity(' + ${item.id} + ', ' + (${item.quantity} + 1) + ')'">+</button>
                    </div>
                </div>

                <div class="cart-item-subtotal" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</div>

                <div>
                    <button class="btn-remove-item" th:onclick="'removeItem(' + ${item.id} + ')'">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>

        <aside class="cart-summary">
            <h3 class="summary-title">Tóm tắt đơn hàng</h3>

            <div class="summary-row">
                <span>Tạm tính</span>
                <span th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</span>
            </div>

            <div class="summary-row">
                <span>Phí vận chuyển</span>
                <span class="highlight">Miễn phí</span>
            </div>

            <div class="summary-row">
                <span>Giảm giá</span>
                <span>0 đ</span>
            </div>

            <div class="coupon-box">
                <input type="text" placeholder="Mã giảm giá">
                <button class="btn-apply-coupon">Áp dụng</button>
            </div>

            <div class="summary-row total">
                <span>Tổng cộng</span>
                <span th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</span>
            </div>

            <a th:href="@{/checkout}" class="btn-checkout">Tiến hành thanh toán</a>
            <a th:href="@{/product}" class="btn-continue-shopping">Tiếp tục mua hàng</a>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
    function changeQuantity(itemId, newQuantity) {
        // Nếu người dùng giảm số lượng về 0, kích hoạt hàm xóa luôn
        if (newQuantity <= 0) {
            removeItem(itemId);
            return;
        }

        // Tạo FormData gửi lên khớp với cơ chế @RequestParam của Controller bạn viết
        const formData = new FormData();
        formData.append('quantity', newQuantity);

        fetch(`/cart/update/${itemId}`, {
            method: 'POST',
            body: formData
        }).then(response => {
            if (response.ok) {
                window.location.reload();
            }
        });
    }

    function removeItem(itemId) {
        if (confirm("Bạn có chắc chắn muốn xóa sản phẩm này khỏi giỏ hàng?")) {
            fetch(`/cart/remove/${itemId}`, {
                method: 'POST'
            }).then(response => {
                if (response.ok) {
                    window.location.reload();
                }
            });
        }
    }
</script>
</body>
</html>
