<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt hàng thành công - HOME DECOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="success-wrapper">
    <div class="success-card">

        <div class="success-icon-box">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1 class="success-title">Đặt hàng thành công!</h1>
        <p class="success-desc">
            Cảm ơn bạn đã tin tưởng Home Decor Store.<br>
            Chúng tôi sẽ liên hệ xác nhận đơn hàng trong vòng 30 phút.
        </p>

        <a th:href="@{/}" class="btn-home">Về trang chủ</a>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
