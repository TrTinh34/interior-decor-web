<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${productDto.id == null} ? 'Thêm Sản Phẩm Mới' : 'Cập Nhật Sản Phẩm'"></title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
<div class="flex h-screen">

    <aside class="w-64 bg-slate-800 text-white p-6 space-y-6 flex-shrink-0">
        <h2 class="text-xl font-bold tracking-wider">HOME DECOR</h2>
        <nav class="space-y-2">
            <a th:href="@{/admin/dashboard}" class="block px-4 py-2.5 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition">Doanh Thu & Thống Kê</a>
            <a th:href="@{/admin/products}" class="block px-4 py-2.5 rounded bg-blue-600 text-white font-medium">Quản lý sản phẩm</a>
            <a th:href="@{/admin/orders}" class="block px-4 py-2.5 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition">Quản lý đơn hàng</a>
            <a th:href="@{/}" class="block px-4 py-2.5 rounded text-gray-400 hover:text-white border-t border-slate-700 mt-6 pt-4">Quay về Cửa Hàng</a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <div class="max-w-4xl bg-white rounded-xl border shadow-sm p-8 mx-auto">
            <h1 class="text-xl font-bold text-gray-800 border-b pb-4 mb-6"
                th:text="${productDto.id == null} ? 'Thêm Sản Phẩm Nội Thất Mới' : 'Cập Nhật Thông Tin Sản Phẩm'"></h1>

            <form th:action="@{/admin/products/save}" method="POST" th:object="${productDto}" enctype="multipart/form-data" class="space-y-6">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imageUrl}">

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tên sản phẩm *</label>
                    <input type="text" th:field="*{name}" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Ví dụ: Ghế sofa gỗ Sồi tự nhiên">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-xs mt-1"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Danh mục sản phẩm *</label>
                        <select th:field="*{categoryId}" class="w-full border rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:border-blue-500">
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                        </select>
                        <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-red-500 text-xs mt-1"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Giá bán (đ) *</label>
                        <input type="number" th:field="*{price}" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="0">
                        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-red-500 text-xs mt-1"></p>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Số lượng tồn kho *</label>
                        <input type="number" th:field="*{stock}" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="0">
                        <p th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" class="text-red-500 text-xs mt-1"></p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Chất liệu</label>
                        <input type="text" th:field="*{material}" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Ví dụ: Gỗ Sồi, Vải nỉ">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Màu sắc</label>
                        <input type="text" th:field="*{color}" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Ví dụ: Vàng mộc, Xám tro">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Kích thước</label>
                        <input type="text" th:field="*{dimensions}" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Ví dụ: 180x80x75 cm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mô tả chi tiết sản phẩm</label>
                    <textarea th:field="*{description}" rows="4" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Nhập đặc điểm nổi bật, hướng dẫn sử dụng..."></textarea>
                </div>

                <div class="border-t pt-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Hình ảnh sản phẩm</label>
                    <div class="flex items-center space-x-6">

                        <div onclick="document.getElementById('imageFileInput').click()"
                             class="w-32 h-32 border-2 border-dashed border-gray-300 rounded-xl overflow-hidden bg-gray-50 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition group relative">

                            <img id="imagePreview" th:src="*{imageUrl != null ? imageUrl : ''}"
                                 class="w-full h-full object-cover" th:classappend="*{imageUrl == null || imageUrl == ''} ? 'hidden' : ''">

                            <div id="previewPlaceholder" class="flex flex-col items-center justify-center text-center p-3"
                                 th:classappend="*{imageUrl != null && imageUrl != ''} ? 'hidden' : ''">
                                <i class="fa-regular fa-image text-2xl text-gray-400 group-hover:text-blue-500 mb-1"></i>
                                <span class="text-xs font-medium text-gray-500 group-hover:text-blue-600">Chọn hình ảnh</span>
                            </div>

                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-white text-xs font-medium">
                                Thay đổi ảnh
                            </div>
                        </div>

                        <div class="flex-1 space-y-1">
                            <input type="file" th:field="*{imageFile}" id="imageFileInput" accept="image/*" class="hidden">
                            <button type="button" onclick="document.getElementById('imageFileInput').click()"
                                    class="px-4 py-2 border rounded-lg text-xs font-semibold text-gray-700 bg-white hover:bg-gray-50 shadow-sm transition">
                                Tải ảnh lên từ thiết bị
                            </button>
                            <p id="fileNameDisplay" class="text-xs text-gray-500 italic mt-1">
                                <span th:text="*{imageUrl != null && imageUrl != ''} ? 'Đang sử dụng ảnh đã lưu trên hệ thống' : 'Chưa có tệp nào được chọn'"></span>
                            </p>
                            <p class="text-[11px] text-gray-400">Định dạng hỗ trợ: .png, .jpg, .jpeg. Dung lượng tối ưu &lt; 2MB.</p>
                        </div>

                    </div>
                </div>

                <div class="flex justify-end space-x-3 border-t pt-6">
                    <a th:href="@{/admin/products}" class="px-5 py-2.5 border rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">Hủy bỏ</a>
                    <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition shadow-sm">Lưu thông tin</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    document.getElementById('imageFileInput').addEventListener('change', function(event) {
        const [file] = event.target.files;
        const preview = document.getElementById('imagePreview');
        const placeholder = document.getElementById('previewPlaceholder');
        const nameDisplay = document.getElementById('fileNameDisplay');

        if (file) {
            // Cập nhật vùng ảnh xem trước
            preview.src = URL.createObjectURL(file);
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');

            // Thay đổi dòng text thông báo tên tệp thay cho lỗi mặc định của Chrome
            nameDisplay.textContent = "📁 Đã chọn tệp: " + file.name;
            nameDisplay.classList.remove('text-gray-500');
            nameDisplay.classList.add('text-emerald-600', 'font-medium');
        }
    });
</script>
</body>
</html>
