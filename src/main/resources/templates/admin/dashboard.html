<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Doanh thu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-sans">
<div class="flex h-screen">
    <aside class="w-64 bg-slate-800 text-white p-6 space-y-6 flex-shrink-0">
        <h2 class="text-xl font-bold tracking-wider">HOME DECOR</h2>
        <nav class="space-y-2">
            <a th:href="@{/admin/dashboard}" class="block px-4 py-2.5 rounded bg-blue-600 text-white font-medium">Doanh Thu & Thống Kê</a>
            <a th:href="@{/admin/products}" class="block px-4 py-2.5 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition">Quản lý sản phẩm</a>
            <a th:href="@{/admin/orders}" class="block px-4 py-2.5 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition">Quản lý đơn hàng</a>
            <a th:href="@{logout/}" class="block px-4 py-2.5 rounded text-gray-400 hover:text-white border-t border-slate-700 mt-6 pt-4">Đăng xuất</a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Thống Kê Doanh Thu</h1>

            <form th:action="@{/admin/dashboard}" method="GET" class="flex items-center space-x-3 bg-white p-2 rounded-lg border">
                <label class="text-sm font-medium text-gray-600 pl-2">Chọn Ngày Xem:</label>
                <input type="date" name="selectedDate" id="selectedDateInput" th:value="${selectedDate}" class="border rounded p-1.5 text-sm focus:outline-blue-500">
                <button type="submit" class="bg-slate-800 text-white text-sm px-4 py-2 rounded hover:bg-slate-700 transition">Lọc dữ liệu</button>
            </form>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Doanh thu ngày được chọn</p>
                <h3 class="text-2xl font-extrabold text-gray-800" th:text="${#numbers.formatDecimal(dailyRevenue, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</h3>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Doanh thu trọn tháng</p>
                <h3 class="text-2xl font-extrabold text-emerald-600" th:text="${#numbers.formatDecimal(monthlyRevenue, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</h3>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Doanh thu trọn năm</p>
                <h3 class="text-2xl font-extrabold text-blue-600" th:text="${#numbers.formatDecimal(yearlyRevenue, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</h3>
            </div>
        </div>

        <div class="bg-white p-8 rounded-xl border shadow-sm">
            <h4 class="text-md font-bold text-gray-700 mb-6">Biểu đồ doanh thu 7 ngày qua (Tính ngược từ ngày được chọn)</h4>
            <div class="relative w-full h-[380px]">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const dateVal = document.getElementById("selectedDateInput").value;

        fetch(`/admin/api/revenue-chart?selectedDate=${dateVal}`)
            .then(res => res.json())
            .then(data => {
                const labels = data.map(item => {
                    const parts = item.date.split('-');
                    return `${parts[2]}/${parts[1]}`; // Chuyển sang format dd/MM
                });
                const revenues = data.map(item => item.revenue);

                const ctx = document.getElementById('revenueChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Doanh thu thực tế (đ)',
                            data: revenues,
                            backgroundColor: '#3b82f6',
                            borderRadius: 6,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f3f4f6' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            });
    });
</script>
</body>
</html>
