<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đơn hàng - HOME DECOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
<div class="flex h-screen">
    <aside class="w-64 bg-slate-800 text-white p-6 space-y-6 flex-shrink-0">
        <h2 class="text-xl font-bold tracking-wider">HOME DECOR</h2>
        <nav class="space-y-2">
            <a th:href="@{/admin/dashboard}" class="block px-4 py-2.5 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition">Doanh Thu & Thống Kê</a>
            <a th:href="@{/admin/products}" class="block px-4 py-2.5 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition">Quản lý sản phẩm</a>
            <a th:href="@{/admin/orders}" class="block px-4 py-2.5 rounded bg-blue-600 text-white font-medium">Quản lý đơn hàng</a>
            <a th:href="@{/logout}" class="block px-4 py-2.5 rounded text-gray-400 hover:text-white border-t border-slate-700 mt-6 pt-4">Đăng xuất</a>
        </nav>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-8">Danh sách tất cả các Đơn Hàng</h1>

        <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-gray-100 text-gray-700 text-xs font-semibold uppercase tracking-wider border-b">
                    <th class="px-6 py-4">Mã ĐH</th>
                    <th class="px-6 py-4">Khách hàng / Thông tin giao</th>
                    <th class="px-6 py-4">Ngày Đặt</th>
                    <th class="px-6 py-4">Tổng tiền</th>
                    <th class="px-6 py-4">Trạng thái hiện tại</th>
                    <th class="px-6 py-4 text-center">Thao tác chuyển đổi</th>
                </tr>
                </thead>
                <tbody class="text-sm divide-y">
                <tr th:each="order : ${orders}" class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 font-bold text-gray-700" th:text="'#' + ${order.id}">#1</td>
                    <td class="px-6 py-4 max-w-sm">
                        <div class="font-medium text-gray-800" th:text="${order.user.fullName}">Tên Khách</div>
                        <div class="text-xs text-gray-500 line-clamp-2 mt-1" th:text="${order.shippingAddress}">Địa chỉ</div>
                    </td>
                    <td class="px-6 py-4 text-gray-500" th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">Ngày đặt</td>
                    <td class="px-6 py-4 font-semibold text-gray-800" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'">0đ</td>
                    <td class="px-6 py-4">
                        <span th:if="${order.status == 'NEW'}" class="px-2.5 py-1 text-xs font-semibold bg-amber-50 text-amber-700 rounded-full border border-amber-200">Mới tạo</span>
                        <span th:if="${order.status == 'SHIPPED'}" class="px-2.5 py-1 text-xs font-semibold bg-blue-50 text-blue-700 rounded-full border border-blue-200">Đang vận chuyển</span>
                        <span th:if="${order.status == 'PAID'}" class="px-2.5 py-1 text-xs font-semibold bg-emerald-50 text-emerald-700 rounded-full border border-emerald-200">Đã thanh toán</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <form th:action="@{/admin/orders/update-status}" method="POST" class="flex items-center justify-center space-x-2">
                            <input type="hidden" name="orderId" th:value="${order.id}">
                            <select name="status" class="border text-xs rounded p-1 focus:outline-blue-500 bg-white">
                                <option value="NEW" th:selected="${order.status == 'NEW'}">Mới tạo</option>
                                <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">Vận chuyển</option>
                                <option value="PAID" th:selected="${order.status == 'PAID'}">Thanh toán xong</option>
                            </select>
                            <button type="submit" class="text-xs bg-slate-800 text-white px-2 py-1 rounded hover:bg-slate-700">Cập nhật</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
